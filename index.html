<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X0L3KZZ DICE</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 34px;
  background: #65dce8;
  font-family: Arial, sans-serif;
}
h1 {
  color: white;
  font-size: 45px;
  letter-spacing: 3px;
}
.dice-area {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 18px;
  padding: 24px;
  background: rgba(255,255,255,.22);
  border: 5px solid white;
  border-radius: 24px;
  width: min(92vw, 650px);
}
.die {
  width: 105px;
  height: 105px;
  border-radius: 20px;
  display: grid;
  place-items: center;
}
.dot {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: white;
}
button {
  border: 0;
  border-radius: 15px;
  padding: 17px 38px;
  background: white;
  color: #28aebb;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>
<h1>X0L3KZZ DICE</h1>

<div class="dice-area">
  <div class="die"><span class="dot"></span></div>
  <div class="die"><span class="dot"></span></div>
  <div class="die"><span class="dot"></span></div>
  <div class="die"><span class="dot"></span></div>
</div>

<button onclick="rollDice()">ROLL DICE</button>

<script>
const colors = [
  "#f44336", "#ff9800", "#ffeb3b",
  "#4caf50", "#2196f3", "#9c27b0"
];

function rollDice() {
  document.querySelectorAll(".die").forEach(die => {
    die.style.backgroundColor =
      colors[Math.floor(Math.random() * colors.length)];
    die.animate(
      [{transform:"rotate(0deg)"},{transform:"rotate(360deg)"}],
      {duration:400}
    );
  });
}

rollDice();
</script>
</body>
</html>
