<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X0L3KZZ DICE</title>
<style>
  :root { --blue:#24b7d4; --deep:#139bbd; --gold:#e7b600; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; padding:28px 16px;
    font-family: "Trebuchet MS", Arial, sans-serif;
    background:linear-gradient(135deg,#83d9eb,#63c8e0 55%,#a1e4ee);
    color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .layout { width:min(1100px,100%); display:grid; grid-template-columns:125px 1fr 125px; gap:22px; align-items:center; }
  .side, .main {
    border:5px solid rgba(255,255,255,.72); border-radius:22px;
    background:rgba(23,174,211,.48); box-shadow:0 5px 0 rgba(25,139,171,.12);
  }
  .side { padding:14px 10px; text-align:center; }
  .side h3 { margin:0 0 13px; font-size:13px; letter-spacing:.5px; }
  .swatches { display:grid; gap:9px; }
  .swatch {
    width:100%; height:34px; border:3px solid rgba(255,255,255,.8);
    border-radius:10px; cursor:pointer; transition:.15s;
  }
  .swatch.off { opacity:.25; filter:grayscale(1); transform:scale(.94); }
  .main { padding:22px clamp(14px,4vw,48px) 25px; text-align:center; }
  h1 { margin:0 0 22px; font-size:clamp(25px,4vw,36px); text-shadow:1px 2px 0 rgba(0,0,0,.08); }
  .selectors { display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin-bottom:26px; }
  select {
    width:min(280px,100%); padding:13px 15px; border:0; border-radius:7px;
    background:#f5f3df; color:#1ca8c7; font-size:17px; font-weight:bold;
  }
  .dice { min-height:90px; display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:12px; margin:0 auto 20px; }
  .die {
    width:76px; height:76px; border:7px solid rgba(255,255,255,.92); border-radius:13px;
    box-shadow:0 3px 7px rgba(0,0,0,.12), inset 0 0 0 2px rgba(0,0,0,.04);
    display:grid; place-items:center; animation:pop .18s ease-out;
  }
  .pip { width:14px; height:14px; background:#fff; border-radius:50%; box-shadow:0 1px 2px #7775; }
  @keyframes pop { from { transform:scale(.75) rotate(-5deg); opacity:.4 } to { transform:scale(1); opacity:1 } }
  .roll {
    width:min(550px,100%); padding:16px 12px; border:0; border-radius:5px;
    background:linear-gradient(#f2c900,#dda900); color:#fff; font-size:22px;
    font-weight:900; text-shadow:1px 2px 1px #9b7b00; cursor:pointer;
    box-shadow:0 4px 0 #bf9800;
  }
  .roll:active { transform:translateY(3px); box-shadow:0 1px 0 #bf9800; }
  .hint { margin:18px auto 0; padding:8px 12px; background:rgba(0,160,198,.28); border-radius:5px; font-size:13px; }
  .actions { display:grid; gap:9px; }
  .actions button {
    border:0; border-radius:6px; padding:9px 5px; background:#e5ad00;
    color:white; font-weight:bold; cursor:pointer; box-shadow:0 2px 0 #bd8e00;
  }
  .actions button:disabled { opacity:.45; cursor:not-allowed; }
  .colors { display:flex; justify-content:center; gap:10px 15px; flex-wrap:wrap; margin-top:24px; }
  .color-option { display:flex; align-items:center; gap:5px; padding:5px 8px; border-radius:5px; background:rgba(255,255,255,.22); font-size:12px; font-weight:900; cursor:pointer; }
  .color-option input { accent-color:#138eae; width:15px; height:15px; cursor:pointer; }
  .status { min-height:18px; margin-top:12px; font-size:13px; color:#fff; }
  @media(max-width:760px) {
    body { padding:18px 12px; align-items:flex-start; }
    .layout { grid-template-columns:1fr; gap:12px; max-width:560px; }
    .side { padding:10px 12px; }
    .swatches { display:flex; justify-content:center; }
    .swatch { width:38px; height:30px; }
    .side h3 { margin-bottom:8px; }
    .right { order:3; }
    .main { order:2; }
    .left { order:1; }
    .actions { display:flex; justify-content:center; }
    .actions button { min-width:100px; }
    .die { width:62px; height:62px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="side left">
    <h3>PICK COLORS</h3>
    <div class="swatches" id="swatches"></div>
  </aside>

  <main class="main">
    <h1>X0L3KZZ DICE</h1>
    <div class="selectors">
      <select id="diceCount" aria-label="Количество кубиков">
        <option value="1">1 DICE</option><option value="2">2 DICE</option>
        <option value="3">3 DICE</option><option value="4" selected>4 DICE</option>
        <option value="5">5 DICE</option><option value="6">6 DICE</option>
        <option value="8">8 DICE</option><option value="10">10 DICE</option>
        <option value="12">12 DICE</option><option value="20">20 DICE</option>
      </select>
      <select aria-label="Тип кубиков"><option>COLOR DICE</option></select>
    </div>
    <div class="dice" id="dice" aria-live="polite"></div>
    <button class="roll" id="roll">ROLL AGAIN !</button>
    <div class="hint">Possible colors are: <span id="colorNames"></span></div>
    <div class="status" id="status">Выбери цвета и нажми ROLL AGAIN!</div>
    <div class="colors" id="colors"></div>
  </main>

  <aside class="side right">
    <h3>YOUR ROLL</h3>
    <div class="actions">
      <button id="undo" disabled>UNDO</button>
      <button id="clear" disabled>CLEAR</button>
    </div>
  </aside>
</div>
<script>
const palette = [
  {name:'RED', ru:'Красный', hex:'#df342d'},
  {name:'ORANGE', ru:'Оранжевый', hex:'#e98b16'},
  {name:'YELLOW', ru:'Жёлтый', hex:'#e8c20a'},
  {name:'GREEN', ru:'Зелёный', hex:'#389a38'},
  {name:'BLUE', ru:'Синий', hex:'#258acb'},
  {name:'PURPLE', ru:'Фиолетовый', hex:'#8952b7'}
];
let enabled = palette.map(() => true);
let history = [];
let current = [];

const swatches = document.getElementById('swatches');
const colors = document.getElementById('colors');
const dice = document.getElementById('dice');
const status = document.getElementById('status');

function renderControls() {
  swatches.innerHTML = '';
  colors.innerHTML = '';
  palette.forEach((c, i) => {
    const sw = document.createElement('button');
    sw.className = 'swatch' + (enabled[i] ? '' : ' off');
    sw.style.background = c.hex;
    sw.title = (enabled[i] ? 'Отключить ' : 'Включить ') + c.ru;
    sw.setAttribute('aria-label', sw.title);
    sw.addEventListener('click', () => toggle(i));
    swatches.appendChild(sw);

    const label = document.createElement('label');
    label.className = 'color-option';
    label.style.color = c.hex;
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = enabled[i];
    cb.addEventListener('change', () => toggle(i));
    label.append(cb, document.createTextNode(c.name));
    colors.appendChild(label);
  });
  const active = palette.filter((c,i) => enabled[i]);
  document.getElementById('colorNames').innerHTML = active.length
    ? active.map(c => `<span style="color:${c.hex};font-weight:bold">${c.name[0]+c.name.slice(1).toLowerCase()}</span>`).join(', ')
    : 'No colors selected';
  document.getElementById('undo').disabled = history.length === 0;
  document.getElementById('clear').disabled = current.length === 0 && history.length === 0;
}
function toggle(i) {
  enabled[i] = !enabled[i];
  renderControls();
  if (!enabled.some(Boolean)) status.textContent = 'Выбери хотя бы один цвет.';
  else status.textContent = 'Доступные цвета обновлены.';
}
function draw() {
  dice.innerHTML = '';
  current.forEach(i => {
    const die = document.createElement('div');
    die.className = 'die';
    die.style.background = palette[i].hex;
    const pip = document.createElement('span'); pip.className = 'pip';
    die.appendChild(pip); dice.appendChild(die);
  });
}
document.getElementById('roll').addEventListener('click', () => {
  const available = enabled.map((v,i) => v ? i : -1).filter(i => i !== -1);
  if (!available.length) { status.textContent = 'Сначала включи хотя бы один цвет!'; return; }
  if (current.length) history.push([...current]);
  const count = Number(document.getElementById('diceCount').value);
  current = Array.from({length:count}, () => available[Math.floor(Math.random()*available.length)]);
  draw(); renderControls();
  status.textContent = 'Выпало кубиков: ' + current.length;
});
document.getElementById('undo').addEventListener('click', () => {
  if (!history.length) return;
  current = history.pop(); draw(); renderControls();
  status.textContent = 'Предыдущий бросок восстановлен.';
});
document.getElementById('clear').addEventListener('click', () => {
  current = []; history = []; dice.innerHTML = ''; renderControls();
  status.textContent = 'Результаты очищены.';
});
renderControls();
</script>
</body>
</html>
